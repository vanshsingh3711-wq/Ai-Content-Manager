<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 3D Character Renderer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: transparent; }
        canvas { display: block; }
    </style>
    <!-- Import Three.js and GLTFLoader from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, mixer, clock;
        let characterModel;
        
        // This function will be called by Python/Playwright to inject the plan!
        window.startRecording = async (characterPlan, audioUrl) => {
            console.log("Python injected the plan!", characterPlan);
            // 1. Play Audio
            // 2. Start MediaRecorder
            // 3. Trigger Animations at timestamps
        };

        function init() {
            clock = new THREE.Clock();

            // 1. Create Scene (Transparent background!)
            scene = new THREE.Scene();

            // 2. Setup Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.5, 3); // Point at character's face/chest

            // 3. Setup Renderer (alpha: true is critical for transparent FFmpeg overlay)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0); // Transparent!
            document.body.appendChild(renderer.domElement);

            // 4. Setup Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); // Soft white light
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 3.0);
            directionalLight.position.set(1, 2, 3);
            scene.add(directionalLight);

            // 5. Load 3D Model
            const loader = new GLTFLoader();
            // We will replace this URL with your custom character later!
            loader.load('https://models.readyplayer.me/64b0f983a48e71887e5b1285.glb', (gltf) => {
                characterModel = gltf.scene;
                scene.add(characterModel);
                
                mixer = new THREE.AnimationMixer(characterModel);
                console.log("3D Model Loaded Successfully!");
                
                // Notify Python that the model is ready to be recorded
                if (window.onModelLoaded) window.onModelLoaded();
            });

            // Start Render Loop
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
