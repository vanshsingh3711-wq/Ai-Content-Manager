<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    #container {
      text-align: center;
    }

    .prefix, .suffix {
      font-size: 80px;
      font-weight: 700;
      color: #ffffff;
    }
    
    #counter {
      font-size: 140px;
      font-weight: 800;
      color: #ff3333; /* Matches the red in the tutorial */
      margin: 0 10px;
      font-variant-numeric: tabular-nums;
    }

    #subtitle {
      font-size: 32px;
      color: #888888;
      margin-top: 20px;
      font-weight: 500;
      opacity: 0;
    }

  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div id="container">
    <div>
      <span class="prefix">Over</span>
      <span id="counter">0</span>
      <span class="suffix">K</span>
    </div>
    <div id="subtitle">prompts processed daily</div>
  </div>

  <script>
    let masterTl = gsap.timeline({ paused: true });

    // The target number
    const targetData = { val: 0 };
    const finalNumber = 500;

    // 1. Fade in the whole container
    masterTl.from("#container", { opacity: 0, y: 50, duration: 1, ease: "power3.out" }, 0);

    // 2. Animate the counter
    masterTl.to(targetData, {
      val: finalNumber,
      duration: 3,
      ease: "power3.inOut",
      onUpdate: function() {
        // Format with no decimal places
        document.getElementById("counter").innerText = Math.round(targetData.val);
      }
    }, 0.5);

    // 3. Fade in subtitle
    masterTl.to("#subtitle", { opacity: 1, y: 0, duration: 1 }, 2);

    window.renderFrame = (frame) => {
        masterTl.time(frame / 30.0);
    };
  </script>
</body>
</html>
